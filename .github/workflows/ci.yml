# CI gate: lint (Biome), typecheck, and the full workspace test run.
#
# The Redis service backs the RedisStore integration tests (0.9 work list #8);
# tests auto-skip when REDIS_URL is absent, so local runs need no Redis.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: node scripts/check-ignore-list.mjs
      - run: node scripts/check-scaffold-range.mjs
      - run: pnpm typecheck
      - run: pnpm test

  # Stator owns its dev loop AND its build, and both are full of path handling —
  # so both must be proven on every OS. File watching (chokidar) diverges across
  # macOS, Linux and Windows; so does resolution, where Windows paths are
  # case-insensitive, `\` and `/` both separate, and esbuild reports real paths.
  # The dev smoke boots `stator dev` and asserts live reload on a route and a
  # machine edit; the build smoke runs `stator build`, checks the copy set that
  # landed in dist/, and boots it.
  # NOTE: job id and name are load-bearing if these are required status checks —
  # renaming them makes branch protection wait forever on a check that no longer
  # reports. Left as-is deliberately, though this job now covers the build too.
  native-dev:
    name: native dev loop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/native-dev-smoke.mjs
      - run: node scripts/build-smoke.mjs
